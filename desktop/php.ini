; =============================================================================
; php.ini de la version desktop (Infinit Registrar)
;
; PHP embarque et autonome : ce fichier est charge automatiquement par php.exe
; place dans le meme dossier. Les chemins sont RELATIFS (extension_dir = "ext")
; pour que le bundle fonctionne quel que soit l'endroit ou l'application est
; installee sur le poste cible.
; =============================================================================

; --- Extensions -------------------------------------------------------------
; Chemin relatif au dossier de php.exe : indispensable a la portabilite.
extension_dir = "ext"

; Base de donnees
extension=pdo_mysql
extension=mysqli

; Texte / encodage
extension=mbstring
extension=intl

; Reseau / securite
extension=openssl
extension=curl
extension=sodium

; Images (badges, photos, dompdf)
extension=gd
extension=exif

; Fichiers / archives (uploads, export)
extension=fileinfo
extension=zip

; --- Erreurs ----------------------------------------------------------------
; Silencieux cote utilisateur : les erreurs ne doivent pas s'afficher dans la
; fenetre de l'application. Elles restent journalisees.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; --- Uploads (photos etudiants/enseignants) ---------------------------------
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 30

; --- Ressources -------------------------------------------------------------
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; --- Divers -----------------------------------------------------------------
; Fuseau de Madagascar (evite les avertissements date/heure).
date.timezone = "Indian/Antananarivo"
default_charset = "UTF-8"
; Sessions dans le dossier temporaire du systeme (defaut Windows).
session.gc_maxlifetime = 7200
